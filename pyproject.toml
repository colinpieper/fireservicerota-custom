[project]
name = "fireservicerota-custom"
version = "2026.10.0"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.367",
    "pyfireservicerota==0.0.49",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["E501", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
